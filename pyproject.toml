[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benweiclaude"
version = "0.1.0"
description = "A LangChain and LangGraph coding assistant CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langchain-openai>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langchain-qwq>=0.3,<1",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9.0,<11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.0,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[project.scripts]
codepilot = "codepilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["codepilot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
files = [
  "src/codepilot/leases.py",
  "src/codepilot/executions.py",
  "src/codepilot/trust.py",
  "src/codepilot/permissions.py",
  "src/codepilot/storage.py",
  "src/codepilot/hooks.py",
  "src/codepilot/reasoning.py",
  "src/codepilot/sandbox/policy.py",
  "src/codepilot/sandbox/result.py",
  "src/codepilot/sandbox/runner.py",
  "src/codepilot/sandbox/backends/base.py",
  "src/codepilot/sandbox/backends/linux.py",
]
